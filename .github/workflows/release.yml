name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-zip:
    name: Build and attach HACS ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build integration ZIP
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/custom_components/anniversary_celebration"
          zip -r "${GITHUB_WORKSPACE}/anniversary_celebration.zip" . \
            -x "*/__pycache__/*" "*.pyc" ".DS_Store" "*/.DS_Store"

      - name: Attach ZIP to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: anniversary_celebration.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
