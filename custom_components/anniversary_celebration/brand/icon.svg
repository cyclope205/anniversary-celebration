<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#2c2630"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff8f1f"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- candle flames -->
  <ellipse cx="96" cy="70" rx="7" ry="12" fill="url(#flame)"/>
  <ellipse cx="128" cy="58" rx="7" ry="12" fill="url(#flame)"/>
  <ellipse cx="160" cy="70" rx="7" ry="12" fill="url(#flame)"/>

  <!-- candles -->
  <rect x="91" y="80" width="10" height="26" rx="2" fill="#ffd60a"/>
  <rect x="123" y="68" width="10" height="38" rx="2" fill="#ffd60a"/>
  <rect x="155" y="80" width="10" height="26" rx="2" fill="#ffd60a"/>

  <!-- top cake layer -->
  <path d="M70 106 h116 l14 26 h-144 z" fill="#ffffff" opacity="0.95"/>
  <path d="M70 106 h116 l14 26 h-144 z" fill="none" stroke="#e8c84a" stroke-width="3"/>

  <!-- middle layer -->
  <rect x="56" y="132" width="144" height="34" rx="6" fill="#f4b8c8"/>
  <rect x="56" y="132" width="144" height="10" rx="5" fill="#ffffff" opacity="0.6"/>

  <!-- base layer -->
  <rect x="44" y="166" width="168" height="40" rx="8" fill="#8fa6c7"/>
  <rect x="44" y="166" width="168" height="10" rx="5" fill="#ffffff" opacity="0.35"/>

  <!-- plate -->
  <rect x="32" y="206" width="192" height="12" rx="6" fill="#ffd60a"/>
</svg>
